<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Designer v3 — Batch Studios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--color-background-primary:#ffffff;--color-background-secondary:#f4f3f0;--color-background-info:#e6f1fb;--color-background-success:#eaf3de;--color-background-warning:#faeeda;--color-text-primary:#2C2C2A;--color-text-secondary:#5F5E5A;--color-text-tertiary:#888780;--color-text-danger:#A32D2D;--color-text-success:#3B6D11;--color-text-warning:#633806;--color-border-secondary:rgba(44,44,42,0.22);--color-border-tertiary:rgba(44,44,42,0.12);--border-radius-md:8px;--border-radius-lg:12px;--font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;}
@media(prefers-color-scheme:dark){:root{--color-background-primary:#1e1e1c;--color-background-secondary:#282826;--color-background-info:#042C53;--color-background-success:#173404;--color-background-warning:#412402;--color-text-primary:#D3D1C7;--color-text-secondary:#888780;--color-text-tertiary:#5F5E5A;--color-text-danger:#F09595;--color-text-success:#97C459;--color-text-warning:#FAC775;--color-border-secondary:rgba(211,209,199,0.2);--color-border-tertiary:rgba(211,209,199,0.1);}}
body{font-family:var(--font-sans);height:100vh;overflow:hidden;}
.mza{display:flex;flex-direction:column;height:100vh;font-size:12px;color:var(--color-text-primary);position:relative;background:var(--color-background-secondary);}
.mztb{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);flex-shrink:0;}
.mzstep{font-size:11px;padding:3px 10px;border:0.5px solid transparent;border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-tertiary);cursor:pointer;white-space:nowrap;}
.mzstep:not(:disabled):hover{background:var(--color-background-secondary);}
.mzstep.on{background:var(--color-background-secondary);border-color:var(--color-border-secondary);color:var(--color-text-primary);}
.mzstep:disabled{cursor:default;opacity:.35;}
.mzsep{color:var(--color-text-tertiary);font-size:10px;padding:0 1px;}
.mzw{display:flex;flex:1;min-height:0;}
.mzlp,.mzrp{width:200px;flex-shrink:0;overflow-y:auto;padding:10px;background:var(--color-background-primary);display:flex;flex-direction:column;gap:6px;}
.mzlp{border-right:0.5px solid var(--color-border-tertiary);}
.mzrp{border-left:0.5px solid var(--color-border-tertiary);}
.mzcc{flex:1;position:relative;overflow:hidden;}
canvas#mzC{position:absolute;top:0;left:0;}
.mzlbl{font-size:9px;color:var(--color-text-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px;}
.mzlbl2{display:flex;justify-content:space-between;font-size:9px;color:var(--color-text-tertiary);margin-top:-2px;}
.mzrow{display:flex;align-items:center;gap:5px;}
.mzval{font-size:11px;font-weight:500;min-width:28px;text-align:right;}
.mzbtn{font-size:11px;padding:3px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);cursor:pointer;white-space:nowrap;font-family:var(--font-sans);}
.mzbtn:hover{background:var(--color-background-secondary);}
.mzbtn.on{background:var(--color-background-info);color:var(--color-text-primary);border-color:var(--color-border-secondary);}
.mzbtn.grn{background:#E6F4EE;color:#1A6E3C;border-color:#2E9E5B;}
.mzbtn.grn.on{background:#2E9E5B;color:#fff;border-color:#1A6E3C;}
.mzbtn.org{background:#FFF0E6;color:#8A3B00;border-color:#D06020;}
.mzbtn.org.on{background:#D06020;color:#fff;border-color:#8A3B00;}
.mzbtn.pri{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent;}
.mzbtn.pri:hover{opacity:.82;}
.mzbtn:disabled{opacity:.3;cursor:not-allowed;}
.mzhr{border:none;border-top:0.5px solid var(--color-border-tertiary);}
.mzs{font-size:11px;padding:3px 5px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:100%;font-family:var(--font-sans);}
.mzr{width:100%;}
.mzn{font-size:11px;padding:2px 5px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:58px;font-family:var(--font-sans);}
.mzh{font-size:10px;color:var(--color-text-tertiary);line-height:1.5;}
.mzstat{display:flex;justify-content:space-between;font-size:11px;padding:1px 0;}
.mzstatl{color:var(--color-text-secondary);font-size:10px;}
.mzstatv{font-weight:500;}
.mzchip{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-tertiary);display:inline-block;}
.mzok{font-size:10px;padding:4px 7px;border-radius:var(--border-radius-md);background:var(--color-background-success);color:var(--color-text-success);line-height:1.4;}
.mzwarn{font-size:10px;padding:4px 7px;border-radius:var(--border-radius-md);background:var(--color-background-warning);color:var(--color-text-warning);line-height:1.4;}
.mzinfo{position:absolute;bottom:10px;left:0;right:0;text-align:center;pointer-events:none;}
.mzib{display:inline-block;font-size:10px;color:var(--color-text-secondary);background:var(--color-background-primary);padding:3px 12px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);}
.mzib.grn{color:#1A6E3C;background:#E6F4EE;border-color:#2E9E5B;}
.mzib.org{color:#8A3B00;background:#FFF0E6;border-color:#D06020;}
.mzsh{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.mzshbtn{width:100%;aspect-ratio:1;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);padding:8px;}
.mzshbtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary);}
.mzshbtn svg{width:100%;height:100%;}
.mzly{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;padding:1px 0;}
.mzswatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.prow{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:var(--border-radius-md);cursor:pointer;font-size:11px;}
.prow:hover,.prow.hl{background:var(--color-background-secondary);}
.pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plen{font-size:10px;color:var(--color-text-tertiary);flex-shrink:0;}
.mzsec{font-size:9px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.05em;text-transform:uppercase;padding:2px 0;}
.mzmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.mzmodal.show{display:flex;}
.mzmodal-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:20px 24px;max-width:320px;width:90%;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.mzmodal-msg{font-size:12px;line-height:1.5;color:var(--color-text-primary);}
.mzmodal-btns{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<div class="mza">
  <div class="mztb">
    <span style="font-size:13px;font-weight:600;margin-right:6px;">Maze Designer</span>
    <span style="font-size:10px;color:var(--color-text-tertiary);margin-right:8px;">v3.3 &middot; Batch Studios</span>
    <button class="mzstep on" id="tb_bnd" onclick="setStep('bnd')">1 &middot; Boundary</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_doors" onclick="setStep('doors')" disabled>2 &middot; Doors</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_gen" onclick="setStep('gen')" disabled>3 &middot; Generate</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_exp" onclick="setStep('exp')" disabled>4 &middot; Export</button>
    <span style="margin-left:auto;display:flex;gap:3px;align-items:center;">
      <span style="font-size:9px;color:var(--color-text-tertiary);margin-right:4px;" id="mzCoord"></span>
      <button class="mzbtn" onclick="vzIn()">+</button>
      <button class="mzbtn" onclick="vzOut()">&ndash;</button>
      <button class="mzbtn" onclick="vzFit()">fit</button>
    </span>
  </div>
  <div class="mzw">
    <div class="mzlp" id="mzLP"></div>
    <div class="mzcc" id="mzCC">
      <canvas id="mzC"></canvas>
      <div class="mzinfo"><span class="mzib" id="mzHint">Select a grid type and draw or pick a boundary shape</span></div>
    </div>
    <div class="mzrp" id="mzRP"></div>
  </div>
  <div class="mzmodal" id="mzModal">
    <div class="mzmodal-box">
      <div class="mzmodal-msg" id="mzModalMsg"></div>
      <div class="mzmodal-btns">
        <button class="mzbtn" onclick="modalCancel()">Keep current</button>
        <button class="mzbtn pri" onclick="modalOk()">Regenerate</button>
      </div>
    </div>
  </div>
</div>
<script>
var TP={mill:{label:'CNC Router / End Mill',di:1,sizes:[{l:'1/16" (1.6mm)',mm:1.588},{l:'1/8" (3.2mm)',mm:3.175},{l:'1/4" (6.4mm)',mm:6.35},{l:'3/8" (9.5mm)',mm:9.525},{l:'1/2" (12.7mm)',mm:12.7}],p:function(mm){return{minP:mm,minW:mm,minC:mm*2.5,wf:0.30,cs:Math.max(Math.ceil(mm*3),6),kerf:mm/2};}},laser:{label:'Laser Cutter',di:1,sizes:[{l:'CO2 light (0.1mm)',mm:0.1},{l:'CO2 std (0.2mm)',mm:0.2},{l:'CO2 heavy (0.3mm)',mm:0.3},{l:'Fiber (0.05mm)',mm:0.05},{l:'UV/Diode (0.08mm)',mm:0.08}],p:function(mm){return{minP:0.5,minW:mm*3,minC:0.5+mm*3,wf:0.12,cs:10,kerf:mm};}},printer:{label:'3D Printer / Nozzle',di:1,sizes:[{l:'0.2mm',mm:0.2},{l:'0.4mm',mm:0.4},{l:'0.6mm',mm:0.6},{l:'0.8mm',mm:0.8}],p:function(mm){return{minP:mm*2,minW:mm*3,minC:mm*5,wf:0.28,cs:Math.max(Math.ceil(mm*8),4),kerf:0};}},ball:{label:'Ball / Marble Maze',di:1,sizes:[{l:'3mm',mm:3},{l:'6mm',mm:6},{l:'8mm',mm:8},{l:'10mm',mm:10},{l:'12mm',mm:12},{l:'16mm',mm:16}],p:function(mm){return{minP:mm*1.3,minW:2,minC:mm*1.3+2,wf:2/(mm*1.3+2),cs:Math.ceil(mm*1.3+2),kerf:0.1};}}};
var SS={rect:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',circle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',hex:'<svg viewBox="0 0 24 24"><polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',oct:'<svg viewBox="0 0 24 24"><polygon points="9,2 15,2 22,9 22,15 15,22 9,22 2,15 2,9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',tri:'<svg viewBox="0 0 24 24"><polygon points="12,2 22,21 2,21" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',diamond:'<svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'};
var S={step:'bnd',gridType:'ortho',bW:200,bH:200,boundary:[],bDone:false,drawTool:'polygon',polyPts:[],freePts:[],freeOn:false,savedBoundaries:[],doors:{exitMode:'perimeter',entries:[],exits:[],placing:'entry',customPath:false,pathCells:[],pathFreeOn:false,pathFreePts:[]},_pg:null,_pf:[],_nearFace:null,cellSize:12,braidPct:0,winding:0.5,bias:'random',toolType:'mill',toolSizeIdx:1,toolDiamMm:3.175,wallFrac:0.30,kerf:1.5,constraints:{minP:3.175,minW:3.175,minC:6.35},cells:[],cmap:{},hasMaze:false,solveData:null,solution:null,altPaths:[],deadBranches:[],activeBranch:null,activeAlt:null,layers:{bnd:true,walls:true,doors:true,grid:false,solution:true,dead:true,alts:true},vx:0,vy:0,vs:2,panning:false,psx:0,psy:0,pvx:0,pvy:0,mw:{x:0,y:0},_modalOk:null};
var cvs=document.getElementById('mzC'),ctx=cvs.getContext('2d'),cc=document.getElementById('mzCC');
function resize(){cvs.width=cc.clientWidth;cvs.height=cc.clientHeight;draw();}
new ResizeObserver(resize).observe(cc);
function w2s(x,y){return{x:x*S.vs+S.vx,y:y*S.vs+S.vy};}
function s2w(x,y){return{x:(x-S.vx)/S.vs,y:(y-S.vy)/S.vs};}
function vzIn(){S.vs=Math.min(S.vs*1.3,50);draw();}
function vzOut(){S.vs=Math.max(S.vs/1.3,0.15);draw();}
function vzFit(){var p=44;S.vs=Math.min((cvs.width-p*2)/S.bW,(cvs.height-p*2)/S.bH);S.vx=cvs.width/2-S.bW/2*S.vs;S.vy=cvs.height/2-S.bH/2*S.vs;draw();}
function ptInPoly(pt,poly){var inside=false;for(var a=0,b=poly.length-1;a<poly.length;b=a++){var xi=poly[a].x,yi=poly[a].y,xj=poly[b].x,yj=poly[b].y;if((yi>pt.y)!=(yj>pt.y)&&pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}
function rdp(pts,eps){if(pts.length<3)return pts;var maxD=0,idx=0,a=pts[0],b=pts[pts.length-1],dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;for(var i=1;i<pts.length-1;i++){var d=Math.abs(dy*pts[i].x-dx*pts[i].y+b.x*a.y-b.y*a.x)/len;if(d>maxD){maxD=d;idx=i;}}if(maxD>eps){return rdp(pts.slice(0,idx+1),eps).slice(0,-1).concat(rdp(pts.slice(idx),eps));}return[a,b];}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function circPts(cx,cy,r,n){n=n||64;var a=[];for(var i=0;i<n;i++)a.push({x:cx+r*Math.cos(2*Math.PI*i/n),y:cy+r*Math.sin(2*Math.PI*i/n)});return a;}
function ngon(cx,cy,r,n){var a=[];for(var i=0;i<n;i++)a.push({x:cx+r*Math.cos(2*Math.PI*i/n-Math.PI/2),y:cy+r*Math.sin(2*Math.PI*i/n-Math.PI/2)});return a;}
function polarCircle(){return circPts(S.bW/2,S.bH/2,Math.min(S.bW,S.bH)*0.44);}
function countTurns(path){if(!path||path.length<3)return 0;var t=0;for(var i=1;i<path.length-1;i++){if(path[i].col-path[i-1].col!==path[i+1].col-path[i].col||path[i].row-path[i-1].row!==path[i+1].row-path[i].row)t++;}return t;}
function cellKey(col,row){return col+','+row;}
function applyPreset(type,idx){S.toolType=type;S.toolSizeIdx=idx;var t=TP[type],mm=t.sizes[idx].mm,p=t.p(mm);S.toolDiamMm=mm;S.constraints={minP:p.minP,minW:p.minW,minC:p.minC};S.cellSize=Math.max(p.cs,S.cellSize);S.wallFrac=Math.max(p.wf,Math.min(0.45,S.wallFrac));S.kerf=p.kerf;renderPanels();}
function constraintStatus(){var passage=S.cellSize*(1-S.wallFrac),wall=S.cellSize*S.wallFrac,c=S.constraints;return{ok:passage>=c.minP-0.01&&wall>=c.minW-0.01&&S.cellSize>=c.minC-0.01,passage:passage,wall:wall};}
function buildPreviewGrid(){var cs=S.cellSize,cols=Math.floor(S.bW/cs),rows=Math.floor(S.bH/cs),ox=(S.bW-cols*cs)/2,oy=(S.bH-rows*cs)/2,cells=[],cmap={};for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){var cx=ox+(c+0.5)*cs,cy=oy+(r+0.5)*cs,inside=!S.bDone||S.boundary.length<3||ptInPoly({x:cx,y:cy},S.boundary),cell={id:cellKey(c,r),col:c,row:r,cx:cx,cy:cy,inside:inside};cells.push(cell);cmap[cell.id]=cell;}}return{cells:cells,cmap:cmap};}
function computePerimFaces(pg){var cs=S.cellSize,faces=[];for(var i=0;i<pg.cells.length;i++){var cell=pg.cells[i];if(!cell.inside)continue;var c=cell.col,r=cell.row,dirs=[{dir:'N',dc:0,dr:-1,mx:cell.cx,my:cell.cy-cs/2},{dir:'S',dc:0,dr:1,mx:cell.cx,my:cell.cy+cs/2},{dir:'W',dc:-1,dr:0,mx:cell.cx-cs/2,my:cell.cy},{dir:'E',dc:1,dr:0,mx:cell.cx+cs/2,my:cell.cy}];for(var d=0;d<dirs.length;d++){var nd=pg.cmap[cellKey(c+dirs[d].dc,r+dirs[d].dr)];if(!nd||!nd.inside)faces.push({col:c,row:r,dir:dirs[d].dir,mx:dirs[d].mx,my:dirs[d].my});}}return faces;}
function nearestPerimFace(pt){var best=null,bd=Infinity;for(var i=0;i<S._pf.length;i++){var f=S._pf[i],d=(f.mx-pt.x)*(f.mx-pt.x)+(f.my-pt.y)*(f.my-pt.y);if(d<bd){bd=d;best=f;}}return best;}
function nearestInsideCell(pt){if(!S._pg)return null;var best=null,bd=Infinity;for(var i=0;i<S._pg.cells.length;i++){var c=S._pg.cells[i];if(!c.inside)continue;var d=(c.cx-pt.x)*(c.cx-pt.x)+(c.cy-pt.y)*(c.cy-pt.y);if(d<bd){bd=d;best=c;}}return best;}
function loadSaved(){try{S.savedBoundaries=JSON.parse(localStorage.getItem('mz-bnd')||'[]');}catch(e){S.savedBoundaries=[];}}
function saveBoundary(){var name=prompt('Name this boundary:');if(!name)return;var b={id:String(Date.now()),name:name,pts:S.boundary.slice()};S.savedBoundaries.unshift(b);if(S.savedBoundaries.length>8)S.savedBoundaries=S.savedBoundaries.slice(0,8);try{localStorage.setItem('mz-bnd',JSON.stringify(S.savedBoundaries));}catch(e){}renderPanels();}
function delSaved(id){S.savedBoundaries=S.savedBoundaries.filter(function(b){return b.id!==id;});try{localStorage.setItem('mz-bnd',JSON.stringify(S.savedBoundaries));}catch(e){}renderPanels();}
function useSaved(id){var b=null;for(var i=0;i<S.savedBoundaries.length;i++)if(S.savedBoundaries[i].id===id){b=S.savedBoundaries[i];break;}if(!b)return;confirmIfMaze('Load saved boundary?',function(){S.boundary=b.pts.slice();S.bDone=true;S.hasMaze=false;clearDoors();S.solution=null;S.solveData=null;renderPanels();draw();});}
function getPos(e){var r=cvs.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}
cvs.addEventListener('mousemove',function(e){var p=getPos(e);S.mw=s2w(p.sx,p.sy);var co=document.getElementById('mzCoord');if(co)co.textContent=S.mw.x.toFixed(1)+'x'+S.mw.y.toFixed(1)+'mm';if(S.panning){S.vx=S.pvx+p.sx-S.psx;S.vy=S.pvy+p.sy-S.psy;draw();return;}if(S.freeOn){var last=S.freePts[S.freePts.length-1];if(!last||(S.mw.x-last.x)*(S.mw.x-last.x)+(S.mw.y-last.y)*(S.mw.y-last.y)>(2/S.vs)*(2/S.vs))S.freePts.push({x:S.mw.x,y:S.mw.y});}if(S.doors.pathFreeOn){var last2=S.doors.pathFreePts[S.doors.pathFreePts.length-1];if(!last2||(S.mw.x-last2.x)*(S.mw.x-last2.x)+(S.mw.y-last2.y)*(S.mw.y-last2.y)>(1.5/S.vs)*(1.5/S.vs))S.doors.pathFreePts.push({x:S.mw.x,y:S.mw.y});}if(S.step==='doors'&&S._pf.length>0)S._nearFace=nearestPerimFace(S.mw);draw();});
cvs.addEventListener('mousedown',function(e){var p=getPos(e);if(e.button===1||e.button===2){S.panning=true;S.psx=p.sx;S.psy=p.sy;S.pvx=S.vx;S.pvy=S.vy;e.preventDefault();return;}if(S.step==='doors'){if(S.doors.customPath)startPathDraw();else handleDoorClick();return;}if(S.step!=='bnd'||S.bDone||S.gridType==='polar')return;if(S.drawTool==='freehand'){S.freeOn=true;S.freePts=[{x:S.mw.x,y:S.mw.y}];return;}if(S.drawTool==='polygon'){var w={x:S.mw.x,y:S.mw.y};if(S.polyPts.length>=3){var f=w2s(S.polyPts[0].x,S.polyPts[0].y);if((p.sx-f.x)*(p.sx-f.x)+(p.sy-f.y)*(p.sy-f.y)<256){closeBnd();return;}}S.polyPts.push(w);draw();}});

  if(S.hasMaze&&(S.doors.entries.length||S.doors.exits.length))solveMaze();

}

function setStep(step){var ok={bnd:true,doors:S.bDone,gen:S.bDone,exp:S.hasMaze};if(!ok[step])return;S.step=step;if(step==='doors')rebuildPreviewGrid();updateTabBar();renderPanels();draw();}
function updateTabBar(){var ok={bnd:true,doors:S.bDone,gen:S.bDone,exp:S.hasMaze},steps=['bnd','doors','gen','exp'];for(var i=0;i<steps.length;i++){var btn=document.getElementById('tb_'+steps[i]);if(!btn)continue;btn.disabled=!ok[steps[i]];btn.classList.toggle('on',S.step===steps[i]);}}
function renderPanels(){renderLeft();renderRight();updateHint();updateTabBar();}
function updateHint(){var el=document.getElementById('mzHint');if(!el)return;var cls='';if(S.step==='doors'){cls=S.doors.placing==='entry'?'grn':S.doors.placing==='exit'?'org':'';}el.className='mzib'+(cls?' '+cls:'');var msg='';if(S.step==='bnd')msg=S.gridType==='polar'?'Concentric -- auto-circular':S.bDone?'Boundary set -- go to Doors':'Draw or pick a shape';else if(S.step==='doors'){if(S.doors.placing==='entry')msg='Click a glowing hotspot on the edge to set ENTRY';else if(S.doors.placing==='exit')msg=S.doors.exitMode==='perimeter'?'Click an edge hotspot to set EXIT':'Click an inside cell to set FINISH';else msg='Doors set -- proceed to Generate';}else if(S.step==='gen')msg=!S.hasMaze?'Set parameters and Generate':S.solution?'Solution: '+S.solution.length+' cells, '+countTurns(S.solution)+' turns':'Maze ready -- click Solve';else msg=S.hasMaze?'Ready to export SVG':'Generate first';el.textContent=msg;}
function renderLeft(){var lp=document.getElementById('mzLP');var h='';if(S.step==='bnd')h=renderBndStep();else if(S.step==='doors')h=renderDoorsStep();else if(S.step==='gen')h=renderGenStep();else h=renderExpStep();lp.innerHTML=h;}
function renderBndStep(){var h='',shapeGrid='',shapeKeys=['rect','circle','hex','oct','tri','diamond'];for(var i=0;i<shapeKeys.length;i++)shapeGrid+='<button class="mzshbtn" onclick="setPreset(\''+shapeKeys[i]+'\')">'+SS[shapeKeys[i]]+'</button>';h+='<div class="mzlbl">Grid type</div><div class="mzrow"><button class="mzbtn '+(S.gridType==='ortho'?'on':'')+'" onclick="setGrid(\'ortho\')">Square</button><button class="mzbtn '+(S.gridType==='polar'?'on':'')+'" onclick="setGrid(\'polar\')">Concentric</button></div>';if(S.gridType==='polar'){h+='<div class="mzlbl" style="margin-top:4px">Board diameter (mm)</div><div class="mzrow"><input class="mzn" type="number" value="'+Math.min(S.bW,S.bH)+'" min="50" max="600" step="10" onchange="var d=+this.value;S.bW=d;S.bH=d;S.boundary=polarCircle();S.hasMaze=false;clearDoors();renderPanels();draw()"> mm</div>';}else{h+='<div class="mzlbl" style="margin-top:4px">Board (mm)</div><div class="mzrow">W <input class="mzn" type="number" value="'+S.bW+'" min="50" max="600" step="10" onchange="S.bW=+this.value;S.hasMaze=false;clearDoors();renderPanels();draw()"> H <input class="mzn" type="number" value="'+S.bH+'" min="50" max="600" step="10" onchange="S.bH=+this.value;S.hasMaze=false;clearDoors();renderPanels();draw()"></div><hr class="mzhr"><div class="mzlbl">Shapes</div><div class="mzsh">'+shapeGrid+'</div><hr class="mzhr"><div class="mzlbl">Draw custom</div><div class="mzrow"><button class="mzbtn '+(S.drawTool==='polygon'?'on':'')+'" onclick="S.drawTool=\'polygon\';S.bDone=false;S.polyPts=[];S.hasMaze=false;clearDoors();renderPanels();draw()">Polygon</button><button class="mzbtn '+(S.drawTool==='freehand'?'on':'')+'" onclick="S.drawTool=\'freehand\';S.bDone=false;S.polyPts=[];S.hasMaze=false;clearDoors();renderPanels();draw()">Freehand</button></div><p class="mzh">'+(S.drawTool==='polygon'?'Click vertices, dbl-click to close':'Hold and drag to draw')+'</p>';}if(S.bDone){h+='<hr class="mzhr"><button class="mzbtn" onclick="saveBoundary()">Save boundary</button><button class="mzbtn" style="color:var(--color-text-danger);margin-top:3px" onclick="clearBoundary()">Clear</button>';}if(S.savedBoundaries.length>0){h+='<hr class="mzhr"><div class="mzlbl">Saved</div>';for(var i=0;i<S.savedBoundaries.length;i++){var b=S.savedBoundaries[i];h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;padding:2px 4px;border-radius:4px"><span style="flex:1;cursor:pointer" onclick="useSaved(\''+b.id+'\')">'+b.name+'</span><button class="mzbtn" style="font-size:9px;padding:1px 4px" onclick="delSaved(\''+b.id+'\')">x</button></div>';}}if(S.bDone)h+='<hr class="mzhr"><button class="mzbtn pri" style="width:100%" onclick="setStep(\'doors\')">Next: Doors</button>';return h;}
function renderDoorsStep(){var d=S.doors,entrySet=d.entries.length>0,exitSet=d.exits.length>0,entryBtnTxt=d.placing==='entry'?'Placing... click edge':(entrySet?'Move entry':'Set entry'),exitBtnTxt=d.placing==='exit'?('Placing... click '+(d.exitMode==='perimeter'?'edge':'inside')):(exitSet?'Move exit':'Set exit'),exitLabel=d.exitMode==='perimeter'?'Exit door':'Finish point',entryDesc=entrySet?'Col '+d.entries[0].col+', row '+d.entries[0].row+' facing '+d.entries[0].dir:'Click the glowing circles on the boundary edge',exitDesc=exitSet?(d.exits[0].dir?'Col '+d.exits[0].col+', row '+d.exits[0].row+' facing '+d.exits[0].dir:'Interior col '+d.exits[0].col+', row '+d.exits[0].row):(d.exitMode==='perimeter'?'Click an edge hotspot':'Click any inside cell'),h='';h+='<div class="mzlbl">Exit type</div><div class="mzrow"><button class="mzbtn '+(d.exitMode==='perimeter'?'on':'')+'" onclick="S.doors.exitMode=\'perimeter\';renderPanels();draw()">Both on edge</button><button class="mzbtn '+(d.exitMode==='interior'?'on':'')+'" onclick="S.doors.exitMode=\'interior\';S.doors.exits=[];renderPanels();draw()">Entry+finish</button></div><hr class="mzhr"><div class="mzlbl" style="color:#1A6E3C">Entry door</div><div class="mzrow"><button class="mzbtn grn '+(d.placing==='entry'?'on':'')+'" style="flex:1" onclick="startPlacing(\'entry\')">'+entryBtnTxt+'</button>';if(entrySet)h+='<button class="mzbtn" onclick="S.doors.entries=[];S.doors.placing=\'entry\';renderPanels();draw()">x</button>';h+='</div><p class="mzh">'+entryDesc+'</p><hr class="mzhr"><div class="mzlbl" style="color:#8A3B00">'+exitLabel+'</div><div class="mzrow"><button class="mzbtn org '+(d.placing==='exit'?'on':'')+'" style="flex:1" onclick="startPlacing(\'exit\')">'+exitBtnTxt+'</button>';if(exitSet)h+='<button class="mzbtn" onclick="S.doors.exits=[];S.doors.placing=\'exit\';renderPanels();draw()">x</button>';h+='</div><p class="mzh">'+exitDesc+'</p><hr class="mzhr"><label class="mzrow" style="cursor:pointer"><input type="checkbox" '+(d.customPath?'checked':'')+' onchange="S.doors.customPath=this.checked;if(!this.checked){S.doors.pathCells=[];S.doors.pathFreePts=[];}renderPanels();draw()"> Custom solution path</label>';if(d.customPath){h+='<p class="mzh">Hold and drag. Starts at entry, ends at exit.</p>';if(d.pathCells.length)h+='<p class="mzh">'+d.pathCells.length+' cells snapped</p><button class="mzbtn" onclick="S.doors.pathCells=[];renderPanels();draw()">Clear path</button>';}h+='<hr class="mzhr"><p class="mzh">Doors optional -- skip to Generate for auto-placement.</p><button class="mzbtn pri" style="width:100%;margin-top:2px" onclick="setStep(\'gen\')">Next: Generate</button>';return h;}
function renderGenStep(){var t=TP[S.toolType],st=constraintStatus(),hasSolve=!!S.solveData,windDesc=S.winding<0.25?'Winding':S.winding>0.75?'Flowing':'Mixed',sizeOpts='';for(var i=0;i<t.sizes.length;i++)sizeOpts+='<option value="'+i+'" '+(i===S.toolSizeIdx?'selected':'')+'>'+t.sizes[i].l+'</option>';var toolOpts='',tkeys=['mill','laser','printer','ball'];for(var i=0;i<tkeys.length;i++)toolOpts+='<option value="'+tkeys[i]+'" '+(tkeys[i]===S.toolType?'selected':'')+'>'+TP[tkeys[i]].label+'</option>';var h='';h+='<div class="mzlbl">Process</div><select class="mzs" onchange="S.toolType=this.value;S.toolSizeIdx=TP[this.value].di;applyPreset(this.value,TP[this.value].di)">'+toolOpts+'</select><div class="mzlbl" style="margin-top:3px">Size / kerf</div><select class="mzs" onchange="S.toolSizeIdx=+this.value;applyPreset(S.toolType,+this.value)">'+sizeOpts+'</select><hr class="mzhr"><div class="mzlbl">Cell size (mm)</div><div class="mzrow"><input type="range" class="mzr" min="'+Math.max(4,Math.ceil(S.constraints.minC))+'" max="32" step="0.5" value="'+S.cellSize+'" oninput="S.cellSize=+this.value;document.getElementById(\'csv\').textContent=this.value+\'mm\'"><span class="mzval" id="csv">'+S.cellSize+'mm</span></div><div class="mzlbl" style="margin-top:2px">Wall fraction</div><div class="mzrow"><input type="range" class="mzr" min="0.05" max="0.45" step="0.01" value="'+S.wallFrac+'" oninput="S.wallFrac=+this.value;document.getElementById(\'wfv\').textContent=(S.wallFrac*S.cellSize).toFixed(1)+\'w / \'+(S.cellSize*(1-S.wallFrac)).toFixed(1)+\'p\';draw()"><span class="mzval" id="wfv">'+(S.wallFrac*S.cellSize).toFixed(1)+'w</span></div><div class="mzlbl" style="margin-top:2px">Braid % <span class="mzchip">loops</span></div><div class="mzrow"><input type="range" class="mzr" min="0" max="100" step="5" value="'+S.braidPct+'" oninput="S.braidPct=+this.value;document.getElementById(\'bvv\').textContent=this.value+\'%\'"><span class="mzval" id="bvv">'+S.braidPct+'%</span></div><div class="mzlbl" style="margin-top:2px">Solution character <span class="mzchip" style="text-transform:none;letter-spacing:0">'+windDesc+'</span></div><div class="mzrow"><input type="range" class="mzr" min="0" max="1" step="0.05" value="'+S.winding+'" oninput="S.winding=+this.value;renderPanels()"></div><div class="mzlbl2"><span>Winding</span><span>Flowing</span></div>';if(S.gridType!=='polar'){h+='<div class="mzlbl" style="margin-top:2px">Bias</div><select class="mzs" onchange="S.bias=this.value"><option value="random" '+(S.bias==='random'?'selected':'')+'>Random</option><option value="N" '+(S.bias==='N'?'selected':'')+'>North</option><option value="S" '+(S.bias==='S'?'selected':'')+'>South</option><option value="E" '+(S.bias==='E'?'selected':'')+'>East</option><option value="W" '+(S.bias==='W'?'selected':'')+'>West</option></select>';}h+='<hr class="mzhr"><button class="mzbtn pri" style="width:100%" onclick="generateMaze()">Generate maze</button>';if(S.hasMaze){h+='<div class="mzrow" style="margin-top:4px"><button class="mzbtn '+(hasSolve?'on':'')+'" style="flex:1" onclick="solveMaze()">Solve</button>';if(hasSolve)h+='<button class="mzbtn" onclick="S.solveData=null;S.solution=null;S.altPaths=[];S.deadBranches=[];renderPanels();draw()">Clear</button>';h+='</div>';if(hasSolve&&S.braidPct>0)h+='<button class="mzbtn" style="width:100%;margin-top:3px" onclick="findAltPaths()">'+(S.altPaths.length?'Refresh':'Find')+' alternates</button>';}return h;}
function renderExpStep(){var h='';h+='<div class="mzlbl">Fabrication</div><div class="mzrow"><span style="font-size:10px;color:var(--color-text-secondary);flex:1">Kerf comp.</span><input class="mzn" type="number" value="'+S.kerf.toFixed(2)+'" min="0" max="2" step="0.05" onchange="S.kerf=+this.value"> mm</div><hr class="mzhr"><div class="mzlbl">SVG layers</div><div style="display:flex;flex-direction:column;gap:3px;font-size:10px"><div style="padding:3px 6px;background:var(--color-background-secondary);border-radius:4px"><b>boundary</b> - profile cut</div><div style="padding:3px 6px;background:var(--color-background-secondary);border-radius:4px"><b>walls</b> - pocket/engrave'+(S.doors.entries.length||S.doors.exits.length?' (door gaps inc.)':'')+'</div>';if(S.solution&&S.solution.length>1)h+='<div style="padding:3px 6px;background:#EDE9FB;border-radius:4px;color:#3C3489"><b>solution</b></div>';if(S.altPaths.length)h+='<div style="padding:3px 6px;background:#F0EFFE;border-radius:4px;color:#534AB7"><b>alt-path-N</b></div>';if(S.deadBranches.length)h+='<div style="padding:3px 6px;background:#FAECE7;border-radius:4px;color:#993C1D"><b>dead-end-N</b></div>';h+='</div><hr class="mzhr"><button class="mzbtn pri" style="width:100%" onclick="exportSVG()" '+(S.hasMaze?'':'disabled')+'>Export SVG</button><button class="mzbtn" style="width:100%;margin-top:3px" onclick="copySVG()" '+(S.hasMaze?'':'disabled')+'>Copy SVG text</button><hr class="mzhr"><p class="mzh">DXF, gcode, tab bridging - v2</p>';return h;}
function renderRight(){var rp=document.getElementById('mzRP'),st=constraintStatus(),h='';h+='<div class="mzsec">Constraints</div><div class="mzstat"><span class="mzstatl">Tool</span><span class="mzstatv">'+S.toolDiamMm.toFixed(2)+'mm</span></div><div class="mzstat"><span class="mzstatl">Min passage</span><span class="mzstatv">'+S.constraints.minP.toFixed(1)+'mm</span></div><div class="mzstat"><span class="mzstatl">Passage</span><span class="mzstatv" style="color:'+(st.ok?'inherit':'var(--color-text-danger)')+'">'+st.passage.toFixed(1)+'mm</span></div><div class="mzstat"><span class="mzstatl">Wall</span><span class="mzstatv">'+st.wall.toFixed(1)+'mm</span></div><div class="'+(st.ok?'mzok':'mzwarn')+'" style="margin-top:3px">'+(st.ok?'Constraints met':'Below minimum')+'</div><hr class="mzhr">';if(S.hasMaze){var insideCount=0,deadCount=0;for(var i=0;i<S.cells.length;i++){if(!S.cells[i].inside)continue;insideCount++;var openWalls=0;if(!S.cells[i].walls.N)openWalls++;if(!S.cells[i].walls.S)openWalls++;if(!S.cells[i].walls.W)openWalls++;if(!S.cells[i].walls.E)openWalls++;if(openWalls===1)deadCount++;}h+='<div class="mzsec">Stats</div><div class="mzstat"><span class="mzstatl">Cells</span><span class="mzstatv">'+insideCount+'</span></div><div class="mzstat"><span class="mzstatl">Dead ends</span><span class="mzstatv">'+deadCount+'</span></div><div class="mzstat"><span class="mzstatl">Braid</span><span class="mzstatv">'+S.braidPct+'%</span></div>';if(S.solution&&S.solution.length>1){var sl=S.solution.length,turns=countTurns(S.solution);h+='<hr class="mzhr"><div class="mzsec">Solution</div><div class="mzstat"><span class="mzstatl">Length</span><span class="mzstatv">'+sl+'c / '+(sl*S.cellSize).toFixed(0)+'mm</span></div><div class="mzstat"><span class="mzstatl">Turns</span><span class="mzstatv">'+turns+'</span></div><hr class="mzhr"><div class="mzsec">Paths</div><div class="prow '+(S.activeAlt===null?'hl':'')+'" onclick="S.activeAlt=null;S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#534AB7"></div><span class="pname">Primary</span><span class="plen">'+sl+'c</span></div>';for(var ai=0;ai<S.altPaths.length;ai++){var isAltHl=S.activeAlt===ai;h+='<div class="prow '+(isAltHl?'hl':'')+'" onclick="S.activeAlt='+(isAltHl?'null':ai)+';S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#AFA9EC"></div><span class="pname">Alt '+(ai+1)+'</span><span class="plen">'+S.altPaths[ai].length+'c</span></div>';}}h+='<hr class="mzhr"><div class="mzsec">Layers</div><label class="mzly"><input type="checkbox" '+(S.layers.bnd?'checked':'')+' onchange="S.layers.bnd=this.checked;draw()"> Boundary</label><label class="mzly"><input type="checkbox" '+(S.layers.walls?'checked':'')+' onchange="S.layers.walls=this.checked;draw()"> Walls</label><label class="mzly"><input type="checkbox" '+(S.layers.doors?'checked':'')+' onchange="S.layers.doors=this.checked;draw()"> Doors</label><label class="mzly"><input type="checkbox" '+(S.layers.grid?'checked':'')+' onchange="S.layers.grid=this.checked;draw()"> Grid</label><label class="mzly"><input type="checkbox" '+(S.layers.solution?'checked':'')+' onchange="S.layers.solution=this.checked;draw()"><div class="pswatch" style="background:#534AB7;margin-left:2px"></div> Solution</label><label class="mzly"><input type="checkbox" '+(S.layers.dead?'checked':'')+' onchange="S.layers.dead=this.checked;draw()"><div class="pswatch" style="background:#993C1D;margin-left:2px"></div> Dead ends</label>';if(S.layers.dead&&S.deadBranches.length>0){h+='<div style="margin-left:14px"><div class="prow '+(S.activeBranch===null?'hl':'')+'" onclick="S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#D85A30"></div><span class="pname">All ('+S.deadBranches.length+')</span></div>';var maxB=Math.min(S.deadBranches.length,8);for(var bi=0;bi<maxB;bi++){var isBrHl=S.activeBranch===bi;h+='<div class="prow '+(isBrHl?'hl':'')+'" onclick="S.activeBranch='+(isBrHl?'null':bi)+';draw();renderRight()"><div class="pswatch" style="background:'+(isBrHl?'#F0997B':'#D85A30')+'"></div><span class="pname">Branch '+(bi+1)+'</span><span class="plen">'+S.deadBranches[bi].length+'c</span></div>';}if(S.deadBranches.length>8)h+='<p class="mzh" style="margin-left:4px">+'+(S.deadBranches.length-8)+' more</p>';h+='</div>';}h+='<label class="mzly"><input type="checkbox" '+(S.layers.alts?'checked':'')+' onchange="S.layers.alts=this.checked;draw()"><div class="pswatch" style="background:#AFA9EC;margin-left:2px"></div> Alternates</label><hr class="mzhr"><button class="mzbtn" style="width:100%" onclick="setStep(\'exp\')">Export</button>';}else{h+='<div class="mzsec">Board</div><div class="mzstat"><span class="mzstatl">Size</span><span class="mzstatv">'+S.bW+'x'+S.bH+'mm</span></div><div class="mzstat"><span class="mzstatl">Cell</span><span class="mzstatv">'+S.cellSize+'mm</span></div><div class="mzstat"><span class="mzstatl">Grid</span><span class="mzstatv">'+(S.gridType==='polar'?'Concentric':'Square')+'</span></div>';}rp.innerHTML=h;}
function init(){loadSaved();applyPreset('mill',1);resize();vzFit();var m=6;S.boundary=[{x:m,y:m},{x:S.bW-m,y:m},{x:S.bW-m,y:S.bH-m},{x:m,y:S.bH-m}];S.bDone=true;renderPanels();draw();}
init();
</script>

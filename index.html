<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Designer v3 — Batch Studios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--color-background-primary:#ffffff;--color-background-secondary:#f4f3f0;--color-background-info:#e6f1fb;--color-background-success:#eaf3de;--color-background-warning:#faeeda;--color-text-primary:#2C2C2A;--color-text-secondary:#5F5E5A;--color-text-tertiary:#888780;--color-text-danger:#A32D2D;--color-text-success:#3B6D11;--color-text-warning:#633806;--color-border-secondary:rgba(44,44,42,0.22);--color-border-tertiary:rgba(44,44,42,0.12);--border-radius-md:8px;--border-radius-lg:12px;--font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;}
@media(prefers-color-scheme:dark){:root{--color-background-primary:#1e1e1c;--color-background-secondary:#282826;--color-background-info:#042C53;--color-background-success:#173404;--color-background-warning:#412402;--color-text-primary:#D3D1C7;--color-text-secondary:#888780;--color-text-tertiary:#5F5E5A;--color-text-danger:#F09595;--color-text-success:#97C459;--color-text-warning:#FAC775;--color-border-secondary:rgba(211,209,199,0.2);--color-border-tertiary:rgba(211,209,199,0.1);}}
body{font-family:var(--font-sans);height:100vh;overflow:hidden;}
.mza{display:flex;flex-direction:column;height:100vh;font-size:12px;color:var(--color-text-primary);position:relative;background:var(--color-background-secondary);}
.mztb{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);flex-shrink:0;}
.mzstep{font-size:11px;padding:3px 10px;border:0.5px solid transparent;border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-tertiary);cursor:pointer;white-space:nowrap;}
.mzstep:not(:disabled):hover{background:var(--color-background-secondary);}
.mzstep.on{background:var(--color-background-secondary);border-color:var(--color-border-secondary);color:var(--color-text-primary);}
.mzstep:disabled{cursor:default;opacity:.35;}
.mzsep{color:var(--color-text-tertiary);font-size:10px;padding:0 1px;}
.mzw{display:flex;flex:1;min-height:0;}
.mzlp,.mzrp{width:200px;flex-shrink:0;overflow-y:auto;padding:10px;background:var(--color-background-primary);display:flex;flex-direction:column;gap:6px;}
.mzlp{border-right:0.5px solid var(--color-border-tertiary);}
.mzrp{border-left:0.5px solid var(--color-border-tertiary);}
.mzcc{flex:1;position:relative;overflow:hidden;}
canvas#mzC{position:absolute;top:0;left:0;}
.mzlbl{font-size:9px;color:var(--color-text-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px;}
.mzlbl2{display:flex;justify-content:space-between;font-size:9px;color:var(--color-text-tertiary);margin-top:-2px;}
.mzrow{display:flex;align-items:center;gap:5px;}
.mzval{font-size:11px;font-weight:500;min-width:28px;text-align:right;}
.mzbtn{font-size:11px;padding:3px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);cursor:pointer;white-space:nowrap;font-family:var(--font-sans);}
.mzbtn:hover{background:var(--color-background-secondary);}
.mzbtn.on{background:var(--color-background-info);color:var(--color-text-primary);border-color:var(--color-border-secondary);}
.mzbtn.grn{background:#E6F4EE;color:#1A6E3C;border-color:#2E9E5B;}
.mzbtn.grn.on{background:#2E9E5B;color:#fff;border-color:#1A6E3C;}
.mzbtn.org{background:#FFF0E6;color:#8A3B00;border-color:#D06020;}
.mzbtn.org.on{background:#D06020;color:#fff;border-color:#8A3B00;}
.mzbtn.pri{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent;}
.mzbtn.pri:hover{opacity:.82;}
.mzbtn:disabled{opacity:.3;cursor:not-allowed;}
.mzhr{border:none;border-top:0.5px solid var(--color-border-tertiary);}
.mzs{font-size:11px;padding:3px 5px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:100%;font-family:var(--font-sans);}
.mzr{width:100%;}
.mzn{font-size:11px;padding:2px 5px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:58px;font-family:var(--font-sans);}
.mzh{font-size:10px;color:var(--color-text-tertiary);line-height:1.5;}
.mzstat{display:flex;justify-content:space-between;font-size:11px;padding:1px 0;}
.mzstatl{color:var(--color-text-secondary);font-size:10px;}
.mzstatv{font-weight:500;}
.mzchip{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-tertiary);display:inline-block;}
.mzok{font-size:10px;padding:4px 7px;border-radius:var(--border-radius-md);background:var(--color-background-success);color:var(--color-text-success);line-height:1.4;}
.mzwarn{font-size:10px;padding:4px 7px;border-radius:var(--border-radius-md);background:var(--color-background-warning);color:var(--color-text-warning);line-height:1.4;}
.mzinfo{position:absolute;bottom:10px;left:0;right:0;text-align:center;pointer-events:none;}
.mzib{display:inline-block;font-size:10px;color:var(--color-text-secondary);background:var(--color-background-primary);padding:3px 12px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);}
.mzib.grn{color:#1A6E3C;background:#E6F4EE;border-color:#2E9E5B;}
.mzib.org{color:#8A3B00;background:#FFF0E6;border-color:#D06020;}
.mzsh{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.mzshbtn{width:100%;aspect-ratio:1;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);padding:8px;}
.mzshbtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary);}
.mzshbtn svg{width:100%;height:100%;}
.mzly{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;padding:1px 0;}
.mzswatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.prow{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:var(--border-radius-md);cursor:pointer;font-size:11px;}
.prow:hover,.prow.hl{background:var(--color-background-secondary);}
.pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plen{font-size:10px;color:var(--color-text-tertiary);flex-shrink:0;}
.mzsec{font-size:9px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.05em;text-transform:uppercase;padding:2px 0;}
.mzmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.mzmodal.show{display:flex;}
.mzmodal-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:20px 24px;max-width:320px;width:90%;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.mzmodal-msg{font-size:12px;line-height:1.5;color:var(--color-text-primary);}
.mzmodal-btns{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<div class="mza">
  <div class="mztb">
    <span style="font-size:13px;font-weight:600;margin-right:6px;">Maze Designer</span>
    <span style="font-size:10px;color:var(--color-text-tertiary);margin-right:8px;">v3.3 &middot; Batch Studios</span>
    <button class="mzstep on" id="tb_bnd" onclick="setStep('bnd')">1 &middot; Boundary</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_doors" onclick="setStep('doors')" disabled>2 &middot; Doors</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_gen" onclick="setStep('gen')" disabled>3 &middot; Generate</button>
    <span class="mzsep">&#8250;</span>
    <button class="mzstep" id="tb_exp" onclick="setStep('exp')" disabled>4 &middot; Export</button>
    <span style="margin-left:auto;display:flex;gap:3px;align-items:center;">
      <span style="font-size:9px;color:var(--color-text-tertiary);margin-right:4px;" id="mzCoord"></span>
      <button class="mzbtn" onclick="vzIn()">+</button>
      <button class="mzbtn" onclick="vzOut()">&ndash;</button>
      <button class="mzbtn" onclick="vzFit()">fit</button>
    </span>
  </div>
  <div class="mzw">
    <div class="mzlp" id="mzLP"></div>
    <div class="mzcc" id="mzCC">
      <canvas id="mzC"></canvas>
      <div class="mzinfo"><span class="mzib" id="mzHint">Select a grid type and draw or pick a boundary shape</span></div>
    </div>
    <div class="mzrp" id="mzRP"></div>
  </div>
  <div class="mzmodal" id="mzModal">
    <div class="mzmodal-box">
      <div class="mzmodal-msg" id="mzModalMsg"></div>
      <div class="mzmodal-btns">
        <button class="mzbtn" onclick="modalCancel()">Keep current</button>
        <button class="mzbtn pri" onclick="modalOk()">Regenerate</button>
      </div>
    </div>
  </div>
</div>
<script>
/* TP: fabrication tool presets — retained for a future "advanced" mode; not currently wired to the UI (the Generate step now uses a single mazerunner-size input). */
var TP={mill:{label:'CNC Router / End Mill',di:1,sizes:[{l:'1/16" (1.6mm)',mm:1.588},{l:'1/8" (3.2mm)',mm:3.175},{l:'1/4" (6.4mm)',mm:6.35},{l:'3/8" (9.5mm)',mm:9.525},{l:'1/2" (12.7mm)',mm:12.7}],p:function(mm){return{minP:mm,minW:mm,minC:mm*2.5,wf:0.30,cs:Math.max(Math.ceil(mm*3),6),kerf:mm/2};}},laser:{label:'Laser Cutter',di:1,sizes:[{l:'CO2 light (0.1mm)',mm:0.1},{l:'CO2 std (0.2mm)',mm:0.2},{l:'CO2 heavy (0.3mm)',mm:0.3},{l:'Fiber (0.05mm)',mm:0.05},{l:'UV/Diode (0.08mm)',mm:0.08}],p:function(mm){return{minP:0.5,minW:mm*3,minC:0.5+mm*3,wf:0.12,cs:10,kerf:mm};}},printer:{label:'3D Printer / Nozzle',di:1,sizes:[{l:'0.2mm',mm:0.2},{l:'0.4mm',mm:0.4},{l:'0.6mm',mm:0.6},{l:'0.8mm',mm:0.8}],p:function(mm){return{minP:mm*2,minW:mm*3,minC:mm*5,wf:0.28,cs:Math.max(Math.ceil(mm*8),4),kerf:0};}},ball:{label:'Ball / Marble Maze',di:1,sizes:[{l:'3mm',mm:3},{l:'6mm',mm:6},{l:'8mm',mm:8},{l:'10mm',mm:10},{l:'12mm',mm:12},{l:'16mm',mm:16}],p:function(mm){return{minP:mm*1.3,minW:2,minC:mm*1.3+2,wf:2/(mm*1.3+2),cs:Math.ceil(mm*1.3+2),kerf:0.1};}}};
var SS={rect:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',circle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',hex:'<svg viewBox="0 0 24 24"><polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',oct:'<svg viewBox="0 0 24 24"><polygon points="9,2 15,2 22,9 22,15 15,22 9,22 2,15 2,9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',tri:'<svg viewBox="0 0 24 24"><polygon points="12,2 22,21 2,21" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',diamond:'<svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'};
var S={step:'bnd',gridType:'ortho',bW:200,bH:200,boundary:[],bDone:false,drawTool:'polygon',bndSource:'template',bndPreset:'rect',polyPts:[],freePts:[],freeOn:false,savedBoundaries:[],doors:{exitMode:'perimeter',entries:[],exits:[],placing:'entry',customPath:false,pathCells:[],pathPainting:false,pathFreeOn:false,pathFreePts:[],anchors:[],anchorMode:false},_pg:null,_pf:[],_nearFace:null,cellSize:12,braidPct:0,winding:0.5,complexity:0.5,bias:'random',seed:0,renderMode:'square',smoothing:0.5,runnerMm:5,clearance:1.4,toolDiamMm:5,wallFrac:0.30,kerf:0,constraints:{minP:5,minW:2.5,minC:7.5},cells:[],cmap:{},hasMaze:false,solveData:null,solution:null,altPaths:[],deadBranches:[],activeBranch:null,activeAlt:null,layers:{bnd:true,walls:true,doors:true,grid:false,solution:true,dead:true,alts:true,path:true,branchDots:true,goal:true},vx:0,vy:0,vs:2,panning:false,psx:0,psy:0,pvx:0,pvy:0,mw:{x:0,y:0},_modalOk:null};
var cvs=document.getElementById('mzC'),ctx=cvs.getContext('2d'),cc=document.getElementById('mzCC');
function resize(){cvs.width=cc.clientWidth;cvs.height=cc.clientHeight;draw();}
new ResizeObserver(resize).observe(cc);
function w2s(x,y){return{x:x*S.vs+S.vx,y:y*S.vs+S.vy};}
function s2w(x,y){return{x:(x-S.vx)/S.vs,y:(y-S.vy)/S.vs};}
function vzIn(){S.vs=Math.min(S.vs*1.3,50);draw();}
function vzOut(){S.vs=Math.max(S.vs/1.3,0.15);draw();}
function vzFit(){var p=44;S.vs=Math.min((cvs.width-p*2)/S.bW,(cvs.height-p*2)/S.bH);S.vx=cvs.width/2-S.bW/2*S.vs;S.vy=cvs.height/2-S.bH/2*S.vs;draw();}
function ptInPoly(pt,poly){var inside=false;for(var a=0,b=poly.length-1;a<poly.length;b=a++){var xi=poly[a].x,yi=poly[a].y,xj=poly[b].x,yj=poly[b].y;if((yi>pt.y)!=(yj>pt.y)&&pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}
function rdp(pts,eps){if(pts.length<3)return pts;var maxD=0,idx=0,a=pts[0],b=pts[pts.length-1],dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;for(var i=1;i<pts.length-1;i++){var d=Math.abs(dy*pts[i].x-dx*pts[i].y+b.x*a.y-b.y*a.x)/len;if(d>maxD){maxD=d;idx=i;}}if(maxD>eps){return rdp(pts.slice(0,idx+1),eps).slice(0,-1).concat(rdp(pts.slice(idx),eps));}return[a,b];}
// Seeded PRNG (mulberry32) so a given seed + settings reproduces the same maze.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var _rng=Math.random;
function setSeed(s){S.seed=s>>>0;_rng=mulberry32(S.seed);}
function newSeed(){S.seed=Math.floor(Math.random()*1e9);if(S.hasMaze)doGenerate();else{renderPanels();}}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(_rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function circPts(cx,cy,r,n){n=n||64;var a=[];for(var i=0;i<n;i++)a.push({x:cx+r*Math.cos(2*Math.PI*i/n),y:cy+r*Math.sin(2*Math.PI*i/n)});return a;}
function ngon(cx,cy,r,n){var a=[];for(var i=0;i<n;i++)a.push({x:cx+r*Math.cos(2*Math.PI*i/n-Math.PI/2),y:cy+r*Math.sin(2*Math.PI*i/n-Math.PI/2)});return a;}
function polarCircle(){return circPts(S.bW/2,S.bH/2,Math.min(S.bW,S.bH)*0.44);}
function countTurns(path){if(!path||path.length<3)return 0;var t=0;for(var i=1;i<path.length-1;i++){if(path[i].col-path[i-1].col!==path[i+1].col-path[i].col||path[i].row-path[i-1].row!==path[i+1].row-path[i].row)t++;}return t;}
function cellKey(col,row){return col+','+row;}
// Mazerunner = the ball / bit / nozzle that travels the maze. Its diameter sets the
// minimum passage width; constraints + cell size derive from it.
// Resolution is derived from the mazerunner size: the pathway gets a clearance multiple so the
// ball/bit moves freely, plus a structural wall. Cell size and wall fraction follow.
function applyGeometry(){var mm=S.runnerMm,pass=mm*S.clearance,wall=Math.max(1.5,mm*0.6);S.cellSize=Math.round((pass+wall)*2)/2;S.wallFrac=wall/S.cellSize;S.constraints={minP:mm,minW:wall,minC:mm+wall};}
function setRunner(mm){mm=Math.max(0.5,Math.min(50,Math.round(mm*10)/10));S.runnerMm=mm;S.toolDiamMm=mm;applyGeometry();renderPanels();draw();}
// Live clearance tweak: recompute geometry and update the read-outs in place (no panel rebuild) for smooth dragging.
function liveClearance(v){S.clearance=Math.max(1.1,Math.min(2,Math.round(v*100)/100));applyGeometry();var e;e=document.getElementById('clrv');if(e)e.innerHTML=S.clearance.toFixed(2)+'&times;';e=document.getElementById('rdPath');if(e)e.textContent=(S.cellSize*(1-S.wallFrac)).toFixed(1)+'mm';e=document.getElementById('rdWall');if(e)e.textContent=(S.cellSize*S.wallFrac).toFixed(1)+'mm';e=document.getElementById('rdCell');if(e)e.textContent=S.cellSize+'mm';e=document.getElementById('rdCells');if(e)e.innerHTML='&asymp;'+estCellCount();draw();}
// Estimate how many grid cells fall inside the current boundary at the current cell size (ortho only).
function estCellCount(){if(S.gridType!=='ortho')return 0;var cs=S.cellSize,cols=Math.floor(S.bW/cs),rows=Math.floor(S.bH/cs),ox=(S.bW-cols*cs)/2,oy=(S.bH-rows*cs)/2,n=0;for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var cx=ox+(c+0.5)*cs,cy=oy+(r+0.5)*cs;if(!S.bDone||S.boundary.length<3||ptInPoly({x:cx,y:cy},S.boundary))n++;}return n;}
function constraintStatus(){var passage=S.cellSize*(1-S.wallFrac),wall=S.cellSize*S.wallFrac,c=S.constraints;return{ok:passage>=c.minP-0.01&&wall>=c.minW-0.01&&S.cellSize>=c.minC-0.01,passage:passage,wall:wall};}
function buildPreviewGrid(){var cs=S.cellSize,cols=Math.floor(S.bW/cs),rows=Math.floor(S.bH/cs),ox=(S.bW-cols*cs)/2,oy=(S.bH-rows*cs)/2,cells=[],cmap={};for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){var cx=ox+(c+0.5)*cs,cy=oy+(r+0.5)*cs,inside=!S.bDone||S.boundary.length<3||ptInPoly({x:cx,y:cy},S.boundary),cell={id:cellKey(c,r),col:c,row:r,cx:cx,cy:cy,inside:inside};cells.push(cell);cmap[cell.id]=cell;}}return{cells:cells,cmap:cmap};}
function computePerimFaces(pg){var cs=S.cellSize,faces=[];for(var i=0;i<pg.cells.length;i++){var cell=pg.cells[i];if(!cell.inside)continue;var c=cell.col,r=cell.row,dirs=[{dir:'N',dc:0,dr:-1,mx:cell.cx,my:cell.cy-cs/2},{dir:'S',dc:0,dr:1,mx:cell.cx,my:cell.cy+cs/2},{dir:'W',dc:-1,dr:0,mx:cell.cx-cs/2,my:cell.cy},{dir:'E',dc:1,dr:0,mx:cell.cx+cs/2,my:cell.cy}];for(var d=0;d<dirs.length;d++){var nd=pg.cmap[cellKey(c+dirs[d].dc,r+dirs[d].dr)];if(!nd||!nd.inside)faces.push({col:c,row:r,dir:dirs[d].dir,mx:dirs[d].mx,my:dirs[d].my});}}return faces;}
function nearestPerimFace(pt){var best=null,bd=Infinity;for(var i=0;i<S._pf.length;i++){var f=S._pf[i],d=(f.mx-pt.x)*(f.mx-pt.x)+(f.my-pt.y)*(f.my-pt.y);if(d<bd){bd=d;best=f;}}return best;}
function nearestInsideCell(pt){if(!S._pg)return null;var best=null,bd=Infinity;for(var i=0;i<S._pg.cells.length;i++){var c=S._pg.cells[i];if(!c.inside)continue;var d=(c.cx-pt.x)*(c.cx-pt.x)+(c.cy-pt.y)*(c.cy-pt.y);if(d<bd){bd=d;best=c;}}return best;}
function loadSaved(){try{S.savedBoundaries=JSON.parse(localStorage.getItem('mz-bnd')||'[]');}catch(e){S.savedBoundaries=[];}}
function saveBoundary(){var name=prompt('Name this boundary:');if(!name)return;var b={id:String(Date.now()),name:name,pts:S.boundary.slice()};S.savedBoundaries.unshift(b);if(S.savedBoundaries.length>8)S.savedBoundaries=S.savedBoundaries.slice(0,8);try{localStorage.setItem('mz-bnd',JSON.stringify(S.savedBoundaries));}catch(e){}renderPanels();}
function delSaved(id){S.savedBoundaries=S.savedBoundaries.filter(function(b){return b.id!==id;});try{localStorage.setItem('mz-bnd',JSON.stringify(S.savedBoundaries));}catch(e){}renderPanels();}

function renderGenStep(){var hasSolve=!!S.solveData,windDesc=S.winding<0.25?'Winding':S.winding>0.75?'Flowing':'Mixed',drawn=S.doors.customPath&&S.doors.pathCells.length>1;var h='';h+='<p class="mzh">Resolution &amp; goal type are set in step 1 &middot; Boundary.</p><hr class="mzhr">'+(drawn?('<div class="mzlbl">Maze complexity <span class="mzchip" id="cxv" style="text-transform:none;letter-spacing:0">'+Math.round(S.complexity*100)+'%</span></div><div class="mzrow"><input type="range" class="mzr" min="0" max="1" step="0.05" value="'+S.complexity+'" oninput="S.complexity=+this.value;document.getElementById(\'cxv\').textContent=Math.round(this.value*100)+\'%\'" onchange="saveSettings()"></div><div class="mzlbl2"><span>Sparse</span><span>Dense</span></div><p class="mzh">Filler maze woven around your drawn path. Loops come from loop-anchors; auto-braid is off while you draw your own solution.</p>'):('<div class="mzlbl">Braid % <span class="mzchip">loops</span></div><div class="mzrow"><input type="range" class="mzr" min="0" max="100" step="5" value="'+S.braidPct+'" oninput="S.braidPct=+this.value;document.getElementById(\'bvv\').textContent=this.value+\'%\'" onchange="saveSettings()"><span class="mzval" id="bvv">'+S.braidPct+'%</span></div><div class="mzlbl" style="margin-top:2px">Solution character <span class="mzchip" id="wdv" style="text-transform:none;letter-spacing:0">'+windDesc+'</span></div><div class="mzrow"><input type="range" class="mzr" min="0" max="1" step="0.05" value="'+S.winding+'" oninput="S.winding=+this.value;var e=document.getElementById(\'wdv\');if(e)e.textContent=(S.winding<0.25?\'Winding\':S.winding>0.75?\'Flowing\':\'Mixed\')" onchange="saveSettings()"></div><div class="mzlbl2"><span>Winding</span><span>Flowing</span></div>'))+'';if(S.gridType!=='polar'){h+='<div class="mzlbl" style="margin-top:2px">Bias</div><select class="mzs" onchange="S.bias=this.value;saveSettings()"><option value="random" '+(S.bias==='random'?'selected':'')+'>Random</option><  layers are written to the SVG.</p><hr class="mzhr"><button class="mzbtn pri" style="width:100%" onclick="exportSVG()" '+(S.hasMaze?'':'disabled')+'>Export SVG</button><button class="mzbtn" style="width:100%;margin-top:3px" onclick="copySVG()" '+(S.hasMaze?'':'disabled')+'>Copy SVG text</button><hr class="mzhr"><p class="mzh">DXF, gcode, tab bridging - v2</p>';return h;}
function renderRight(){var rp=document.getElementById('mzRP'),sc=rp?rp.scrollTop:0,st=constraintStatus(),h='';h+='<div class="mzsec">Constraints</div><div class="mzstat"><span class="mzstatl">Mazerunner</span><span class="mzstatv">'+S.toolDiamMm.toFixed(1)+'mm</span></div><div class="mzstat"><span class="mzstatl">Min passage</span><span class="mzstatv">'+S.constraints.minP.toFixed(1)+'mm</span></div><div class="mzstat"><span class="mzstatl">Passage</span><span class="mzstatv" style="color:'+(st.ok?'inherit':'var(--color-text-danger)')+'">'+st.passage.toFixed(1)+'mm</span></div><div class="mzstat"><span class="mzstatl">Wall</span><span class="mzstatv">'+st.wall.toFixed(1)+'mm</span></div><div class="'+(st.ok?'mzok':'mzwarn')+'" style="margin-top:3px">'+(st.ok?'Constraints met':'Below minimum')+'</div><hr class="mzhr">';if(S.hasMaze){var insideCount=0,deadCount=0;for(var i=0;i<S.cells.length;i++){if(!S.cells[i].inside)continue;insideCount++;var openWalls=0;if(!S.cells[i].walls.N)openWalls++;if(!S.cells[i].walls.S)openWalls++;if(!S.cells[i].walls.W)openWalls++;if(!S.cells[i].walls.E)openWalls++;if(openWalls===1)deadCount++;}h+='<div class="mzsec">Stats</div><div class="mzstat"><span class="mzstatl">Cells</span><span class="mzstatv">'+insideCount+'</span></div><div class="mzstat"><span class="mzstatl">Dead ends</span><span class="mzstatv">'+deadCount+'</span></div><div class="mzstat"><span class="mzstatl">Braid</span><span class="mzstatv">'+S.braidPct+'%</span></div>';if(S.solution&&S.solution.length>1){var sl=S.solution.length,turns=countTurns(S.solution);h+='<hr class="mzhr"><div class="mzsec">Solution</div><div class="mzstat"><span class="mzstatl">Length</span><span class="mzstatv">'+sl+'c / '+(sl*S.cellSize).toFixed(0)+'mm</span></div><div class="mzstat"><span class="mzstatl">Turns</span><span class="mzstatv">'+turns+'</span></div><hr class="mzhr"><div class="mzsec">Paths</div><div class="prow '+(S.activeAlt===null?'hl':'')+'" onclick="S.activeAlt=null;S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#534AB7"></div><span class="pname">Primary</span><span class="plen">'+sl+'c</span></div>';for(var ai=0;ai<S.altPaths.length;ai++){var isAltHl=S.activeAlt===ai;h+='<div class="prow '+(isAltHl?'hl':'')+'" onclick="S.activeAlt='+(isAltHl?'null':ai)+';S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#AFA9EC"></div><span class="pname">Alt '+(ai+1)+'</span><span class="plen">'+S.altPaths[ai].length+'c</span></div>';}}h+='<hr class="mzhr"><div class="mzsec">Layers</div><label class="mzly"><input type="checkbox" '+(S.layers.bnd?'checked':'')+' onchange="S.layers.bnd=this.checked;draw()"> Boundary</label><label class="mzly"><input type="checkbox" '+(S.layers.walls?'checked':'')+' onchange="S.layers.walls=this.checked;draw()"> Walls</label><label class="mzly"><input type="checkbox" '+(S.layers.doors?'checked':'')+' onchange="S.layers.doors=this.checked;draw()"> Doors</label><label class="mzly"><input type="checkbox" '+(S.layers.grid?'checked':'')+' onchange="S.layers.grid=this.checked;draw()"> Grid</label>'+(S.doors.pathCells.length?'<label class="mzly"><input type="checkbox" '+(S.layers.path?'checked':'')+' onchange="S.layers.path=this.checked;draw()"> Drawn path</label>':'')+'<label class="mzly"><input type="checkbox" '+(S.layers.branchDots?'checked':'')+' onchange="S.layers.branchDots=this.checked;draw()"> Branch dots</label><label class="mzly"><input type="checkbox" '+(S.layers.solution?'checked':'')+' onchange="S.layers.solution=this.checked;draw()"><div class="pswatch" style="background:#534AB7;margin-left:2px"></div> Solution</label><label class="mzly"><input type="checkbox" '+(S.layers.dead?'checked':'')+' onchange="S.layers.dead=this.checked;draw()"><div class="pswatch" style="background:#993C1D;margin-left:2px"></div> Dead ends</label>';if(S.layers.dead&&S.deadBranches.length>0){h+='<div style="margin-left:14px"><div class="prow '+(S.activeBranch===null?'hl':'')+'" onclick="S.activeBranch=null;draw();renderRight()"><div class="pswatch" style="background:#D85A30"></div><span class="pname">All ('+S.deadBranches.length+')</span></div>';for(var bi=0;bi<S.deadBranches.length;bi++){var br=S.deadBranches[bi],bc=br.color||'#D85A30',bn=br.name||('Branch '+(bi+1));h+='<div class="mzrow" style="gap:4px;padding:1px 4px"><input type="color" value="'+bc+'" title="Branch color" style="width:18px;height:16px;flex-shrink:0;padding:0;border:0.5px solid var(--color-border-secondary);border-radius:3px;background:none;cursor:pointer" oninput="S.deadBranches['+bi+'].color=this.value;draw()" onfocus="S.activeBranch='+bi+';draw()"><input class="mzn" style="flex:1;width:auto;min-width:0;padding:1px 4px" value="'+bn.replace(/"/g,'&quot;')+'" oninput="S.deadBranches['+bi+'].name=this.value" onfocus="S.activeBranch='+bi+';draw()"><span class="plen" style="flex-shrink:0">'+br.length+'c</span></div>';}h+='</div>';}h+=(S.altPaths.length?'<label class="mzly"><input type="checkbox" '+(S.layers.alts?'checked':'')+' onchange="S.layers.alts=this.checked;draw()"><div class="pswatch" style="background:#AFA9EC;margin-left:2px"></div> Alternates</label>':'')+'<hr class="mzhr"><button class="mzbtn" style="width:100%" onclick="setStep(\'exp\')">Export</button>';}else{h+='<div class="mzsec">Board</div><div class="mzstat"><span class="mzstatl">Size</span><span class="mzstatv">'+S.bW+'x'+S.bH+'mm</span></div><div class="mzstat"><span class="mzstatl">Cell</span><span class="mzstatv">'+S.cellSize+'mm</span></div>'+(S.gridType==='ortho'?'<div class="mzstat"><span class="mzstatl">Grid cells</span><span class="mzstatv">&asymp;'+estCellCount()+'</span></div>':'')+'<div class="mzstat"><span class="mzstatl">Grid</span><span class="mzstatv">'+(S.gridType==='polar'?'Concentric':'Square')+'</span></div><div class="mzstat"><span class="mzstatl">Goal</span><span class="mzstatv">'+(S.doors.exitMode==='perimeter'?'Exit':'Inner')+'</span></div>';}rp.innerHTML=h;if(rp)rp.scrollTop=sc;}
function init(){loadSaved();loadSettings();if(!S.seed)S.seed=Math.floor(Math.random()*1e9);setRunner(S.runnerMm);resize();vzFit();if(S.gridType==='polar'){S.boundary=polarCircle();}else{var m=6;S.boundary=[{x:m,y:m},{x:S.bW-m,y:m},{x:S.bW-m,y:S.bH-m},{x:m,y:S.bH-m}];}S.bDone=true;renderPanels();draw();}
init();
